<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orca · quick-answer panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;color:oklch(97% .002 70)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid oklch(85% .08 250);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:oklch(74% .008 70)}
.choice{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:left}
.choice:hover{background:oklch(30% .003 70)}
.key{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:oklch(34% .003 70);font-size:12px;font-weight:600;color:oklch(88% .004 70)}
kbd{font:inherit;padding:1px 6px;border-radius:5px;background:oklch(34% .003 70);color:oklch(88% .004 70)}
</style>
</helmet>
<div style="width: 680px; height: 340px; box-sizing: border-box; background: oklch(17% .003 70); display: grid; place-items: center">
<div role="dialog" aria-label="Quick answer" style="width: 640px; box-sizing: border-box; background: oklch(24% .003 70); border: 1px solid oklch(38% .003 70); border-radius: 18px; box-shadow: 0 24px 80px oklch(0% 0 0 / .5); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div class="meta"><span class="dot" style="background: oklch(72% .12 250)"></span>Work<span>·</span>Ledger backfill migration<span>·</span>noi-signals<span style="flex: 1"></span>oldest of 3 · waiting 3m</div>
<p style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.35">Backfill tenant ledgers now, or migrate lazily on read?</p>
<p style="margin: 0; font-size: 12.5px; color: oklch(74% .008 70)">Backfill locks the ledger table for about 4 minutes on staging.</p>
<div style="display: flex; flex-direction: column; gap: 2px">
<button class="choice" style="background: oklch(32% .003 70)"><span class="key">1</span><span style="flex: 1">Backfill now</span><span class="meta">default</span></button>
<button class="choice"><span class="key">2</span><span style="flex: 1">Lazy on read</span></button>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; background: oklch(19% .003 70); border: 1px solid oklch(34% .003 70)"><span class="key">3</span><input type="text" aria-label="Type an answer" placeholder="Or type an answer…" style="flex: 1; border: 0; background: none; color: inherit; font: inherit; font-size: 14px; outline: none"></label>
<div class="meta" style="gap: 14px"><span><kbd>1</kbd>–<kbd>3</kbd> answer</span><span><kbd>Tab</kbd> next question</span><span><kbd>Esc</kbd> close</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":680,"height":340}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
